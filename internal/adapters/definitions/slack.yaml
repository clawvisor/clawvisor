service:
  id: slack
  display_name: Slack
  description: "Send and receive messages, search channel history, manage reactions, and list files across your Slack workspace."
  setup_url: "https://api.slack.com/apps"
  key_hint: "Slack bot token (xoxb-...)"
  icon_url: "/logos/slack.svg"
  identity:
    endpoint: "/auth.test"
    method: POST
    field: "team"

auth:
  type: api_key
  header: "Authorization"
  header_prefix: "Bearer "
  extra_headers:
    Content-Type: "application/json; charset=utf-8"
  pkce_flow:
    client_id: "10583998234834.10816798669877"
    client_id_env: "SLACK_CLIENT_ID"
    scopes: ["channels:read", "channels:history", "groups:read", "groups:history", "im:read", "im:history", "chat:write", "search:read", "users:read", "reactions:write", "files:read"]
    authorize_url: "https://slack.com/oauth/v2/authorize"
    token_url: "https://slack.com/api/oauth.v2.access"
    token_path: "authed_user.access_token"

verification_hints: >
  Thread-level parameters (e.g. thread_ts) are within the scope of the channel
  they belong to. Accessing thread replies is not a scope escalation beyond
  channel-level access — threads are part of a channel conversation.

api:
  base_url: "https://slack.com/api"
  type: rest

actions:
  list_channels:
    display_name: "List channels"
    risk: { category: read, sensitivity: low, description: "List Slack channels" }
    method: GET
    path: "/conversations.list"
    params:
      limit: { type: int, default: 200, max: 1000, location: query }
      types: { type: string, default: "public_channel,private_channel", location: query }
      cursor: { type: string, location: query }
    error_check: { success_path: "ok", error_path: "error" }
    response:
      data_path: "channels"
      fields:
        - { name: id }
        - { name: name }
        - { name: num_members }
        - { name: is_private }
      meta:
        - { name: response_metadata.next_cursor, rename: next_cursor }
      summary: "{{len .Data}} channel(s)"

  get_channel:
    display_name: "Get channel"
    risk: { category: read, sensitivity: low, description: "Read a specific Slack channel" }
    method: GET
    path: "/conversations.info"
    params:
      channel: { type: string, required: true, location: query }
    error_check: { success_path: "ok", error_path: "error" }
    response:
      data_path: "channel"
      fields:
        - { name: id }
        - { name: name }
        - { name: num_members }
        - { name: is_private }
        - { name: is_archived }
      summary: "Channel #{{.name}}"

  list_messages:
    display_name: "List messages"
    risk: { category: read, sensitivity: low, description: "List messages in a Slack channel" }
    method: GET
    path: "/conversations.history"
    params:
      channel: { type: string, required: true, location: query }
      limit: { type: int, default: 50, max: 1000, location: query }
      oldest: { type: string, location: query }
      latest: { type: string, location: query }
      cursor: { type: string, location: query }
    error_check: { success_path: "ok", error_path: "error" }
    response:
      data_path: "messages"
      fields:
        - { name: user }
        - { name: text, sanitize: true }
        - { name: ts }
        - { name: thread_ts, optional: true }
        # Projected down to the fields needed to identify and fetch an
        # attachment — a raw Slack file object carries ~40 fields of
        # thumbnail and preview metadata per file.
        - name: files
          expr: 'files == nil ? nil : map(files, {{"id": #.id, "name": #.name, "mimetype": #.mimetype, "size": #.size}})'
          optional: true
      meta:
        - { name: response_metadata.next_cursor, rename: next_cursor }
      summary: "{{len .Data}} message(s)"

  send_message:
    display_name: "Send message"
    risk: { category: write, sensitivity: medium, description: "Send a Slack message" }
    method: POST
    path: "/chat.postMessage"
    params:
      channel: { type: string, required: true, location: body }
      text: { type: string, required: true, location: body }
      thread_ts: { type: string, location: body }
    error_check: { success_path: "ok", error_path: "error" }
    response:
      fields:
        - { name: channel }
        - { name: ts }
      summary: "Message sent to {{.channel}}"

  search_messages:
    display_name: "Search messages"
    risk: { category: search, sensitivity: low, description: "Search Slack messages" }
    method: GET
    path: "/search.messages"
    params:
      query: { type: string, required: true, location: query }
      count: { type: int, default: 20, max: 100, location: query }
      page: { type: int, default: 1, location: query }
    error_check: { success_path: "ok", error_path: "error" }
    response:
      data_path: "messages.matches"
      fields:
        - { name: text, sanitize: true }
        - { name: ts }
        - { name: username }
        - { name: permalink }
        - { name: channel_id, path: "channel.id" }
        - { name: channel_name, path: "channel.name" }
      meta:
        - { name: messages.paging.pages, rename: total_pages }
        - { name: messages.paging.total, rename: total_results }
      summary: "{{len .Data}} result(s)"

  list_users:
    display_name: "List users"
    risk: { category: read, sensitivity: low, description: "List Slack workspace users" }
    method: GET
    path: "/users.list"
    params:
      limit: { type: int, default: 100, max: 1000, location: query }
      cursor: { type: string, location: query }
    error_check: { success_path: "ok", error_path: "error" }
    response:
      data_path: "members"
      fields:
        - { name: id }
        - { name: name }
        - { name: real_name }
        - { name: is_bot }
        - { name: is_admin }
      meta:
        - { name: response_metadata.next_cursor, rename: next_cursor }
      summary: "{{len .Data}} user(s)"

  list_files:
    display_name: "List files"
    risk: { category: read, sensitivity: low, description: "List files in a Slack workspace" }
    method: GET
    path: "/files.list"
    params:
      channel: { type: string, location: query }
      user: { type: string, location: query }
      types: { type: string, location: query }
      count: { type: int, default: 50, max: 200, location: query }
      page: { type: int, default: 1, location: query }
    error_check: { success_path: "ok", error_path: "error" }
    response:
      data_path: "files"
      fields:
        - { name: id }
        - { name: name, sanitize: true }
        - { name: title, sanitize: true, optional: true }
        - { name: mimetype }
        - { name: size }
        - { name: created }
        - { name: user, optional: true }
        - { name: permalink, optional: true }
      meta:
        - { name: paging.pages, rename: total_pages }
        - { name: paging.total, rename: total_results }
      summary: "{{len .Data}} file(s)"

  get_file:
    display_name: "Get file"
    risk: { category: read, sensitivity: low, description: "Read metadata for a specific Slack file" }
    method: GET
    path: "/files.info"
    params:
      file: { type: string, required: true, location: query }
    error_check: { success_path: "ok", error_path: "error" }
    response:
      data_path: "file"
      fields:
        - { name: id }
        - { name: name, sanitize: true }
        - { name: title, sanitize: true, optional: true }
        - { name: mimetype }
        - { name: size }
        - { name: created }
        - { name: user, optional: true }
        - { name: permalink, optional: true }
      summary: "File {{.name}}"

  # Go override: the content lives on files.slack.com rather than the API
  # base URL and is returned as raw bytes, neither of which the YAML REST
  # runtime can express.
  download_file:
    display_name: "Download file"
    risk: { category: read, sensitivity: low, description: "Download a file's content from Slack" }
    override: go
    # Content is always returned base64-encoded, for every file type, so the
    # file round-trips byte for byte. Decode it before use.
    params:
      file_id:
        type: string
        required: true
        description: "Slack file ID (e.g. F01234ABCDE), from list_files or a message's files[]"
      max_bytes:
        type: int
        description: >
          Maximum bytes to download (default 1 MB, max 10 MB). Content is
          returned base64-encoded, which inflates it by ~4/3 — only raise this
          when streaming the response to a file rather than reading it into
          context.
